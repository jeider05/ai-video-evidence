<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Pasajeros — demo</title>
  <style>
    body { font: 16px/1.5 system-ui, Segoe UI, sans-serif; background: #f2f4f7; margin: 0; }
    header { background: #101828; color: #fff; padding: 14px 32px; font-weight: 600; }
    main { max-width: 560px; margin: 48px auto; background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 16px; }
    button { margin-top: 24px; padding: 10px 20px; border: 0; border-radius: 8px; background: #175cd3; color: #fff; font-size: 16px; cursor: pointer; }
    #toast { margin-top: 20px; padding: 12px 16px; border-radius: 8px; display: none; }
    #toast.ok { display: block; background: #ecfdf3; color: #067647; }
    #saving { display: none; margin-top: 20px; color: #475467; }
  </style>
</head>
<body>
  <header>Trip demo · Pasajeros</header>
  <main>
    <h2>Nuevo pasajero</h2>
    <label for="name">Nombre completo</label>
    <input id="name" autocomplete="off">
    <label for="phone">Teléfono</label>
    <input id="phone" autocomplete="off">
    <button id="save">Guardar</button>
    <div id="saving">Guardando…</div>
    <div id="toast"></div>
  </main>
  <script>
    document.getElementById('save').addEventListener('click', async () => {
      const saving = document.getElementById('saving');
      const toast = document.getElementById('toast');
      toast.className = '';
      saving.style.display = 'block';
      const res = await fetch('/api/passengers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name.value, phone: phone.value }),
      });
      saving.style.display = 'none';
      // BUG: the status is never checked, so a 500 still shows success.
      if (!res.ok) console.error('POST /api/passengers failed with', res.status);
      toast.textContent = 'Pasajero guardado correctamente';
      toast.className = 'ok';
    });
  </script>
</body>
</html>
